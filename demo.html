<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FixIt — Quản lý bán hàng & hàng hoàn</title>
<style>
:root{--ink:#19343b;--muted:#73858a;--line:#e4ebeb;--bg:#f5f8f7;--green:#087f73;--nav:#132a32;--soft:#e8f4f0;--amber:#a66b16}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.layout{display:flex;min-height:100vh}.sidebar{background:var(--nav);color:#c1cecf;width:230px;padding:25px 16px;position:fixed;inset:0 auto 0 0}.logo{font-size:30px;font-weight:800;color:white;padding:5px 12px 26px}.navlabel{font-size:10px;color:#819a9e;padding:14px 12px 8px;text-transform:uppercase;letter-spacing:.1em}.nav{padding:11px 12px;border-radius:8px;margin:4px 0;cursor:pointer}.nav:hover,.nav.active{background:#25464d;color:white}.main{margin-left:230px;width:calc(100% - 230px);padding:25px 34px 50px}.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);margin-bottom:34px}.pill,.tag{display:inline-flex;border-radius:20px;background:var(--soft);color:var(--green);padding:5px 10px;font-size:12px;font-weight:650}.heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}h1{font-size:27px;margin:0 0 3px}h2{font-size:17px;margin:0 0 14px}p{color:var(--muted)}.btn{background:var(--green);color:white;padding:10px 16px;border-radius:8px;font-weight:650}.btn.secondary{background:white;color:var(--ink);border:1px solid var(--line)}.btn.light{background:#e8f4f0;color:var(--green)}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:20px 0}.card,.panel{background:white;border:1px solid var(--line);border-radius:13px;padding:20px}.metric{font-size:30px;font-weight:750;color:var(--green)}.panel{margin:16px 0}.table{width:100%;border-collapse:collapse}.table th{text-align:left;color:var(--muted);font-size:12px;font-weight:600}.table td,.table th{padding:13px 10px;border-bottom:1px solid var(--line)}.link{color:var(--green);cursor:pointer;font-weight:650}.steps{display:flex;gap:8px;margin:20px 0}.step{padding:8px 12px;background:#ebf0ef;border-radius:8px;color:var(--muted);font-size:12px}.step.on{background:var(--soft);color:var(--green)}.row{display:flex;gap:14px;align-items:center}.grow{flex:1}.camera{min-height:240px;border-radius:12px;background:#e8eeeb;display:grid;place-items:center;text-align:center;color:#607a78;padding:20px}.shirt{font-size:72px}.modalbg{position:fixed;inset:0;background:#10252eb0;display:grid;place-items:center;padding:20px;z-index:5}.modal{background:white;border-radius:16px;padding:25px;width:min(620px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 70px #081b2340}.modal h2{font-size:20px}.field{display:grid;gap:6px;margin:13px 0}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:8px;padding:11px;color:var(--ink);background:white}.field textarea{min-height:80px}.end{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.notice{background:#fff6e7;color:#805913;padding:12px;border-radius:9px}.empty{padding:35px;text-align:center;color:var(--muted)}.hidden{display:none!important}.sub{font-size:12px;color:var(--muted)}@media(max-width:800px){.sidebar{width:68px;padding:12px 7px}.logo{font-size:0;padding:8px}.logo:after{content:'F';font-size:25px}.nav{font-size:0;text-align:center}.nav:before{content:attr(data-icon);font-size:17px}.navlabel{display:none}.main{margin-left:68px;width:calc(100% - 68px);padding:18px 14px}.cards{grid-template-columns:1fr}.table{font-size:12px}.hide-mobile{display:none}}
</style></head><body><div class="layout"><aside class="sidebar"><div class="logo">fixit.</div><div class="navlabel">Tổng quan</div><div class="nav active" data-page="home" data-icon="⌂">Tổng quan</div><div class="navlabel">Bán hàng</div><div class="nav" data-page="orders" data-icon="▤">Đơn hàng</div><div class="nav" data-page="products" data-icon="□">Sản phẩm</div><div class="nav" data-page="inventory" data-icon="▦">Kho hàng</div><div class="nav" data-page="stores" data-icon="▣">Gian hàng TMĐT</div><div class="navlabel">Trọng tâm FixIt</div><div class="nav" data-page="returns" data-icon="↩">Hàng hoàn <span class="tag">3</span></div><div class="nav" data-page="evidence" data-icon="▶">Video đã đóng gói</div><div class="nav" data-page="claims" data-icon="✓">Khiếu nại</div><div class="navlabel">Quản lý</div><div class="nav" data-page="reports" data-icon="▥">Báo cáo</div><div class="nav" data-page="settings" data-icon="⚙">Cài đặt</div></aside><main class="main"><div class="top"><span>Shop Minh An　/　Quản lý bán hàng</span><span class="pill">DEMO · dữ liệu mẫu</span></div><div id="app"></div></main></div><div id="modal"></div>
<script>
const orders=[{id:'FX-1024',product:'Áo sơ mi trắng · M',total:'289.000đ',status:'Chờ xác nhận',channel:'TikTok Shop',packed:false},{id:'FX-1025',product:'Bộ sản phẩm · 2 món',total:'420.000đ',status:'Chờ đóng gói',channel:'Shopee',packed:false},{id:'FX-1026',product:'Áo thun đen · L',total:'199.000đ',status:'Đã đóng gói',channel:'TikTok Shop',packed:true}];let returns=[{id:'FX-1024',product:'Áo sơ mi trắng · M',reason:'Sản phẩm bị hư hỏng',status:'Cần kiểm tra',diff:'Dấu hiệu rách ở thân áo (00:24 video mở kiện)'}];let current='home';const app=document.querySelector('#app'),modal=document.querySelector('#modal');
function go(p){current=p;document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===p));render()}document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>go(n.dataset.page));function open(html){modal.innerHTML='<div class="modalbg" onclick="if(event.target===this)close()"><div class="modal">'+html+'</div></div>'}function close(){modal.innerHTML=''}
function render(){const titles={home:'Tổng quan',orders:'Đơn hàng',products:'Sản phẩm',inventory:'Kho hàng',stores:'Gian hàng TMĐT',returns:'Hàng hoàn về',evidence:'Video đã đóng gói',claims:'Hồ sơ khiếu nại',reports:'Báo cáo',settings:'Cài đặt'};let head=`<div class="heading"><div><h1>${titles[current]}</h1><div class="sub">Quản lý đơn giản, theo dõi rõ từng bước.</div></div>${current==='orders'?'<button class="btn" onclick="scanModal(\'pack\')">＋ Quay đóng gói</button>':''}${current==='returns'?'<button class="btn" onclick="scanModal(\'return\')">＋ Nhận hàng hoàn</button>':''}</div>`;if(current==='home')app.innerHTML=head+`<div class="cards"><div class="card">Đơn hôm nay<div class="metric">24</div><span class="sub">TikTok Shop · Shopee</span></div><div class="card">Hàng hoàn cần kiểm tra<div class="metric">3</div><span class="sub">1 hồ sơ sắp hết hạn</span></div><div class="card">Chờ duyệt khiếu nại<div class="metric">1</div><span class="sub">Bạn là người quyết định gửi</span></div></div><div class="panel"><h2>Việc cần xử lý</h2>${returnTable()}</div><div class="panel"><h2>Đơn hàng mới</h2>${orderTable()}</div>`;else if(current==='orders')app.innerHTML=head+`<div class="steps"><span class="step on">Tất cả đơn</span><span class="step">Chờ xác nhận</span><span class="step">Chờ đóng gói</span><span class="step">Đã đóng gói</span></div><div class="panel">${orderTable()}</div>`;else if(current==='returns')app.innerHTML=head+`<div class="steps"><span class="step on">Cần kiểm tra</span><span class="step">Chờ bổ sung</span><span class="step">Chờ duyệt</span><span class="step">Đã gửi khiếu nại</span></div><div class="panel">${returnTable()}</div>`;else if(current==='evidence')app.innerHTML=head+`<div class="panel"><h2>Tìm video theo mã đơn hàng</h2><div class="row"><input id="findorder" placeholder="Nhập mã đơn, ví dụ FX-1024" style="padding:12px;border:1px solid var(--line);border-radius:8px;flex:1"><button class="btn" onclick="findVideo()">Tìm video</button></div><div id="findresult"></div></div><div class="panel"><h2>Đơn hàng đã gói gần đây</h2>${orderTable(true)}</div>`;else if(current==='claims')app.innerHTML=head+`<div class="panel">${returns.map((r,i)=>`<h2>${r.id} · ${r.product}</h2><p>${r.reason}</p><button class="btn" onclick="claim(${i})">Mở hồ sơ khiếu nại</button>`).join('<hr>')||'<div class="empty">Chưa có hồ sơ</div>'}</div>`;else{let msg={products:'Danh mục, SKU, biến thể và giá bán.',inventory:'Tồn thực tế · Có thể bán · Đang giữ chỗ.',stores:'TikTok Shop　● Đã kết nối (mô phỏng)<br>Shopee　● Đã kết nối (mô phỏng)',reports:'Doanh thu, đơn hàng và tình trạng hàng hoàn.',settings:'Thiết lập chi nhánh, nhân viên và quyền duyệt.'}[current];app.innerHTML=head+`<div class="panel"><h2>${titles[current]}</h2><p>${msg}</p><span class="pill">Dữ liệu demo</span></div>`}}
function orderTable(packedOnly=false){let rows=orders.filter(o=>!packedOnly||o.packed);return `<table class="table"><thead><tr><th>Mã đơn hàng</th><th>Sản phẩm</th><th class="hide-mobile">Kênh</th><th>Trạng thái</th><th></th></tr></thead><tbody>${rows.map(o=>`<tr><td><b>${o.id}</b></td><td>${o.product}</td><td class="hide-mobile">${o.channel}</td><td><span class="tag">${o.status}</span></td><td>${!o.packed?`<span class="link" onclick="confirmOrder('${o.id}')">Xác nhận</span>　<span class="link" onclick="scanModal('pack','${o.id}')">Quay đóng gói</span>`:`<span class="link" onclick="go('evidence')">Xem video</span>`}</td></tr>`).join('')}</tbody></table>`}function returnTable(){return `<table class="table"><thead><tr><th>Mã đơn</th><th>Sản phẩm</th><th>Lý do trả</th><th>Trạng thái</th><th></th></tr></thead><tbody>${returns.map((r,i)=>`<tr><td><b>${r.id}</b></td><td>${r.product}</td><td>${r.reason}</td><td><span class="tag">${r.status}</span></td><td><span class="link" onclick="scanModal('return','${r.id}')">Kiểm tra kiện →</span></td></tr>`).join('')}</tbody></table>`}
function confirmOrder(id){const o=orders.find(x=>x.id===id);o.status='Chờ đóng gói';render()}function scanModal(mode,id=''){open(`<h2>${mode==='pack'?'Quét mã đơn để quay đóng gói':'Quét mã đơn hàng hoàn'}</h2><p>Quét mã trên phiếu/kiện hoặc nhập mã đơn để tìm đúng hồ sơ.</p><div class="field"><label>Mã đơn hàng</label><input id="scanid" value="${id}" placeholder="VD: FX-1024" autofocus></div><div class="notice">Demo: có thể nhập mã mẫu FX-1024 hoặc FX-1025.</div><div class="end"><button class="btn secondary" onclick="close()">Để sau</button><button class="btn" onclick="scanNext('${mode}')">Xác nhận mã</button></div>`)}function scanNext(mode){let id=document.querySelector('#scanid').value.trim();if(mode==='pack'){let o=orders.find(x=>x.id===id);if(!o)return alert('Không tìm thấy mã đơn.');close();camera('pack',id)}else{let r=returns.find(x=>x.id===id);if(!r){returns.push({id,product:'Sản phẩm trong đơn · M',reason:'Khác',status:'Cần kiểm tra',diff:''})}close();camera('return',id)}}
function camera(mode,id){open(`<h2>${mode==='pack'?'Quay video đóng gói':'Quay video mở kiện hoàn'} · ${id}</h2><div class="camera"><div><div class="shirt">▣</div><b>${mode==='pack'?'Đặt sản phẩm và mã đơn trong khung hình':'Quay 6 mặt kiện, mã đơn và quá trình mở'}</b><div class="sub">Bản demo mô phỏng camera</div></div></div><p id="recstate" class="pill">Sẵn sàng</p><div class="end"><button class="btn secondary" onclick="close()">Hủy</button><button id="record" class="btn" onclick="recordVideo('${mode}','${id}')">● Bắt đầu quay</button></div>`)}function recordVideo(mode,id){const b=document.querySelector('#record');b.textContent='■ Dừng & lưu video';b.onclick=()=>{if(mode==='pack'){let o=orders.find(x=>x.id===id);o.packed=true;o.status='Đã đóng gói';close();render();alert('Đã lưu video đóng gói gắn với '+id)}else{close();compare(id)}};document.querySelector('#recstate').textContent='ĐANG QUAY · 00:08'}
function compare(id){const r=returns.find(x=>x.id===id);r.diff=r.diff||'Chưa phát hiện điểm khác biệt tự động.';open(`<h2>Đối chiếu bằng chứng · ${id}</h2><div class="row"><div class="camera grow"><div>📦<br>Video đóng hàng<br><span class="sub">Tìm theo mã đơn · đã lưu</span></div></div><div class="camera grow"><div>📦<br>Video mở kiện<br><span class="sub">Vừa quay · đã lưu</span></div></div></div><div class="panel"><h2>Điểm cần người bán kiểm tra</h2><label><input type="checkbox" checked> ${r.diff}</label><p>Đây là gợi ý tự động. Xác nhận, sửa hoặc thêm điểm khác biệt sau khi tự kiểm tra video.</p><div class="field"><label>Thêm nhận xét / điểm khác biệt</label><textarea id="difftext" placeholder="Mô tả thêm nếu AI chưa phát hiện"></textarea></div><div class="field"><label>Ảnh bổ sung</label><input type="file" accept="image/*" multiple></div></div><div class="end"><button class="btn secondary" onclick="close()">Lưu để xem sau</button><button class="btn" onclick="saveDiff('${id}')">Xác nhận & tạo hồ sơ</button></div>`)}function saveDiff(id){let r=returns.find(x=>x.id===id),t=document.querySelector('#difftext').value;if(t)r.diff+='; '+t;r.status='Chờ người bán duyệt';close();go('claims');claim(returns.indexOf(r))}
function claim(i){let r=returns[i];open(`<h2>Chuẩn bị khiếu nại · ${r.id}</h2><p>Biểu mẫu tham khảo cho luồng TikTok Shop. Kiểm tra thông tin trên Seller Center trước khi gửi.</p><div class="field"><label>Lý do khiếu nại</label><select><option>Sản phẩm hoàn trả bị hư hỏng</option><option>Trả sai sản phẩm / không khớp đơn ban đầu</option><option>Thiếu sản phẩm trong kiện hoàn</option><option>Chưa nhận được hàng hoàn</option><option>Khác</option></select></div><div class="field"><label>Mô tả sự việc</label><textarea>${r.diff||'Vui lòng kiểm tra bằng chứng của đơn hàng.'}</textarea></div><h2>Bằng chứng đính kèm</h2><p>✓ Video đóng gói　 ✓ Video mở kiện　 ✓ Mốc khác biệt đã xác nhận</p><div class="field"><label>Ảnh vận đơn / ảnh sản phẩm / ảnh so sánh bổ sung</label><input type="file" accept="image/*" multiple></div><div class="notice">Người bán cần xem lại lý do và bằng chứng trước khi gửi. Thời hạn khiếu nại phụ thuộc trạng thái yêu cầu trên TikTok Shop.</div><div class="end"><button class="btn secondary" onclick="close()">Đóng</button><button class="btn" onclick="close();alert('Đã lưu bản nháp minh họa. Hãy gửi khiếu nại trên Seller Center.');">Lưu bản nháp</button></div>`)}function findVideo(){let id=document.querySelector('#findorder').value;let o=orders.find(x=>x.id===id&&x.packed);document.querySelector('#findresult').innerHTML=o?`<div class="panel"><b>${o.id}</b> · ${o.product}<p>✓ Video đóng hàng đã lưu · đơn gắn mã ${o.id}</p><button class="btn light">▶ Xem video mẫu</button></div>`:`<p class="notice">Chưa tìm thấy video đóng gói theo mã này. Kiểm tra mã đơn hoặc xác nhận đơn đã được quay đóng gói.</p>`}render();
</script></body></html>
